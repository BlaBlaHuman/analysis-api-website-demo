[project]
site_url = "https://www.example.com/"
site_name = "Kotlin Analysis API"
site_description = "Official library for analyzing Kotlin code"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/JetBrains/kotlin/tree/master/analysis"
repo_name = "Analysis API Sources"
# edit_uri = "edit/main/docs/"

nav = [
    { "Kotlin Analysis API" = "index.md" },
    { "Documentation" = [
        "documentation/index.md",
        "documentation/Fundamentals.md",
        "documentation/Symbols.md",
        "documentation/Types.md",
        "documentation/Annotations.md",
        "documentation/References-And-Calls.md",
        { "Other" = [
            "documentation/Java-Kotlin-Bridging.md",
            "documentation/In-memory-file-analysis.md",
        ] },
    ] },
    { "API reference" = "api/index.md" },
    { "Contribution guide" = [
        "contribution-guide/index.md",
        "contribution-guide/api-development.md",
        "contribution-guide/api-evolution.md",
        "contribution-guide/endpoint-card.md",
    ] },
    { "Design documents" = [
        "design-documents/README.md",
        "design-documents/restricted-analysis.md",
        "design-documents/project-structure/content-and-resolution-scope-architecture.md",
    ] },
]

# extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/api-frame.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
favicon = "assets/logo.png"
language = "en"
features = [
    "announce.dismiss",
    # "content.action.edit",
    # "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
#    "navigation.sections",
    "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    # "toc.integrate",
]

logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = { }
admonition = { }
attr_list = { }
def_list = { }
footnotes = { }
md_in_html = { }
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = { }
pymdownx.caret = { }
pymdownx.details = { }
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = { }
pymdownx.keys = { }
pymdownx.magiclink = { }
pymdownx.mark = { }
pymdownx.smartsymbols = { }
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = { }
